version: "3.8"

services:
  xau-trading:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: xau_trading_v1
    restart: unless-stopped
    
    env_file:
      - ../config/.env
    
    volumes:
      # Mount logs for persistence
      - ./logs:/home/xau_trader/app/logs
      # Mount models for persistence
      - ./models:/home/xau_trader/app/models
      # Heartbeat file
      - /tmp/xau_heartbeat:/tmp/xau_heartbeat
    
    # Resource limits
    deploy:
      resources:
        limits:
          cpus: "4"
          memory: 8G
        reservations:
          cpus: "2"
          memory: 4G
    
    # Healthcheck
    healthcheck:
      test: ["CMD", "python", "-c", "import os; os.path.exists('/tmp/xau_heartbeat') and (__import__('time').time() - os.path.getmtime('/tmp/xau_heartbeat')) < 90"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    
    # Security
    security_opt:
      - no-new-privileges:true
    read_only: false
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE

  # Optional: PostgreSQL for trade database
  postgres:
    image: postgres:16-alpine
    container_name: xau_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: xau_trading
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-changeme}
    volumes:
      - pg_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pg_data:
